<section class="w-full bg-white py-3">
  <div class="container mx-auto max-w-6xl mb-4">
    <!-- Main Heading -->
    <h1 class="section-heading">What We Do</h1>
      <!-- Services Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-1">
      {% for service in site.data.whatwedo %}
      <!-- Event Management -->
      <div class="relative h-[40rem] overflow-hidden rounded-3xl transition-all duration-300 ease-in-out hover:h-[45rem]">
        <img src="{{ site.baseurl }}/assets/img/whatwedo/{{ service.image }}" alt="Event Management" class="w-full h-full object-cover">
        <div class="absolute inset-0 flex flex-col justify-end p-6">
          <h3 class="text-white font-bold text-2xl [writing-mode:sideways-lr]">{{service.title}}</h3>
        </div>
      </div> 
      {% endfor %}    
    </div>
  </div>
</section>
